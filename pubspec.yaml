name: project1
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  vibration: ^1.8.4
  audioplayers: ^6.0.0
  font_awesome_flutter: ^10.7.0
  flutter_html: ^3.0.0
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  http: ^1.2.2
  path_provider: ^2.1.5
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.3.0
  change_app_package_name: ^1.5.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  webview_flutter: ^4.8.0
  video_player: ^2.8.3


dev_dependencies:
  flutter_native_splash: ^2.4.0
  
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/sounds/start.mp3
     - assets/images/logo.mov

  
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal.ttf

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  
flutter_native_splash:
  color: "#121212" # 🔥 الخلفية
  image: assets/images/logo.png # 🔥 اللوجو

  android: true
  ios: true

  android_12:
    image: assets/images/logo.png
    color: "#121212"  
